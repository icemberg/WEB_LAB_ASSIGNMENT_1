<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Achievements</title>
          <link
               href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
               rel="stylesheet">
          <link rel="stylesheet" href="style.css">
          <link rel="stylesheet"
               href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
     </head>
     <body>
          <header class="bg-primary text-white text-center py-4">
               <h1>Achievements</h1>
          </header>
          <main class="container py-5">
               <div class="row">
                    <div class="col-md-4" data-aos="fade-up">
                         <div class="achievement-card">
                              <img src="achievements1.png" alt="Achievement 1"
                                   class="img-fluid">
                              <h4>Hackathon Winner</h4>
                              <p>Won the National AI Hackathon 2023 for building
                                   an innovative map-matching algorithm.</p>
                         </div>
                    </div>
                    <div class="col-md-4" data-aos="fade-up"
                         data-aos-delay="100">
                         <div class="achievement-card">
                              <img src="achievements2.png" alt="Achievement 2"
                                   class="img-fluid">
                              <h4>Top Coder</h4>
                              <p>Ranked in the top 1% globally on HackerRank in
                                   problem-solving and algorithms.</p>
                         </div>
                    </div>
               </div>
          </main>
          <footer class="bg-dark text-white text-center py-3">
               <p>&copy; 2024 My Portfolio. All rights reserved.</p>
          </footer>
          <script
               src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
          <script
               src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
          <script>AOS.init();</script>
     </body>
</html>
